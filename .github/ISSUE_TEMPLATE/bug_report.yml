name: Bug report
description: Create a report to help us improve GravesX
title: "[Bug] "
labels:
  - bug
assignees:
  - Legoman99573

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Please fill out **all required fields**. Incomplete reports, outdated versions, and unsupported environments
        (hybrid jars, plugin managers, very old or underpowered hardware) may be closed without investigation.

  - type: input
    id: mc_server_version
    attributes:
      label: Minecraft Server Version
      description: >
        Run `/version` in your server console and paste the **full line** that shows your server implementation
        and version. Do NOT just write "1.21.1".
      placeholder: "This server is running Paper version git-Paper-123 (MC: 1.21.1) ..."
    validations:
      required: true

  - type: input
    id: graves_version
    attributes:
      label: GravesX Version
      description: "Provide the exact GravesX version from the JAR file name."
      placeholder: "e.g. GravesX-4.9.10.5-286.jar"
    validations:
      required: true

  - type: input
    id: graves_dump
    attributes:
      label: `/graves dump` output
      description: "Provide the output of the `/graves dump` command. Paste a link (e.g. mclo.gs, hastebin, etc.) rather than raw text."
      placeholder: "https://mclo.gs/your-log-here"
    validations:
      required: true

  - type: input
    id: spark_profile
    attributes:
      label: Spark Profile / Performance Dump
      description: >
        Required **only** when reporting TPS or performance issues.
        Please include a Spark profile link or similar performance report.
        Note: most performance problems are caused by outdated or underpowered hardware,
        oversized worlds, or overloaded servers, which are generally outside the scope of GravesX support.
      placeholder: "https://spark.lucko.me/your-profile-here"

  - type: textarea
    id: summary
    attributes:
      label: Summary of the bug
      description: "A short, clear summary of the issue."
      placeholder: "e.g. Grave was supposed to spawn."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: "List all steps to reliably reproduce the issue."
      placeholder: |
        1. ...
        2. ...
        3. ...
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      description: "Describe what you expected to happen."
      placeholder: "e.g. Grave went to the heavens and never spawned in."
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual Result
      description: "Describe what actually happened, including any errors or missing behavior."
      placeholder: "e.g. Grave went to the heavens and never spawned in nor my items."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: "If applicable, add screenshots or video links to help explain your problem."

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information / Full Stack Trace
      description: >
        **If your issue involves any errors or exceptions, you MUST include the
        full, uncut stack trace here.**
        Do NOT paste only the first line (e.g. "NullPointerException") or a
        cropped screenshot. Copy everything relevant from your console or latest.log and
        paste it inside a code block.
        
        You may also include:
        - Relevant config sections (with secrets removed)
        - Links to full logs (mclo.gs, etc.)
        - Any extra context that might help reproduce the issue
      placeholder: |
        ---- BEGIN FULL STACK TRACE ----
        [paste entire stack trace here, not snippets as it helps nobody]
        ---- END FULL STACK TRACE ----

        Additional context:
        - ...
        - ...
    validations:
      required: true

  - type: checkboxes
    id: version_confirmation
    attributes:
      label: Environment & Support Confirmation
      description: "Please confirm all of the following to ensure this report is supportable."
      options:
        - label: I confirm this issue occurs on the latest GravesX release or development build, not an outdated version.
          required: true
        - label: I understand that if I use development builds in a production environment and lose data, I will not receive support for that data loss.
          required: true
        - label: I understand that issues caused by other forks or Graves 4.9 are not supported here and may be closed.
          required: true
        - label: I am not running an outdated version of GravesX for this report.
          required: true
        - label: I am not using a Plugin Manager/Management plugin to load/unload GravesX. I understand these cause many behavioral issues and are not supported.
          required: true
        - label: I have checked existing issues and confirmed this is not a duplicate.
          required: true
        - label: I understand that reports with insufficient information or using outdated versions may be closed. I may open a new report after updating and providing full details.
          required: true
        - label: I am running a supported server type (Spigot, Paper, Folia, etc.) and not a hybrid jar (e.g. Mohist), which is not supported.
          required: true
        - label: I have tested with only GravesX installed (or with minimal plugins) to rule out plugin conflicts where possible.
          required: true
        - label: I am not just clicking checkboxes at random; I have read and understood the above.
          required: false